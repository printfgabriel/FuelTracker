name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production web bundle
        run: npm run build

      - name: Add Capacitor Android platform
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: Configure Android app launcher icons
        run: |
          python3 -c "import PIL" 2>/dev/null || (sudo apt-get update && sudo apt-get install -y python3-pil)
          python3 - <<'EOF'
          import shutil
          from pathlib import Path
          from PIL import Image

          src = Path('public/logo.png')
          res_dir = Path('android/app/src/main/res')
          anydpi = res_dir / 'mipmap-anydpi-v26'
          if anydpi.exists():
              shutil.rmtree(anydpi)

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }

          base_img = Image.open(src).convert('RGBA')
          for folder, px in sizes.items():
              target_dir = res_dir / folder
              target_dir.mkdir(parents=True, exist_ok=True)
              resized = base_img.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(target_dir / 'ic_launcher.png', format='PNG')
              resized.save(target_dir / 'ic_launcher_round.png', format='PNG')
          EOF

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../FuelTracker.apk

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 FuelTracker.apk --clobber
          else
            gh release create v1.0.0 FuelTracker.apk \
              --title "FuelTracker v1.0.0 (Android APK)" \
              --notes "APK Android do FuelTracker pronto para download e instalação direta no celular. Inclui cálculo automático de litros, consumo por palitinhos, base de 102 modelos brasileiros (incluindo Palio ELX 2010 1.0 com 16 palitinhos), análise estatística por janela temporal (6M/1A/Global) e sincronização com Conta Google."
          fi
